name: Secret scan

# The profile README is edited from both a local clone and the GitHub web editor.
# Local hooks do not run for web edits, so scan the full history here as well.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 03:47 JST. The non-round minute avoids peak scheduler load.
    - cron: '47 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
